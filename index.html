<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>水与活字</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Crect y='15.5' width='32' height='1' fill='%23f5f4f0'/%3E%3Cpath d='M12 9h8l1 2-2 2c4 2 5 5 5 8 0 4-3 6-8 6s-8-2-8-6c0-3 1-6 5-8l-2-2z' fill='%231c130d' stroke='%23f5f4f0' stroke-width='.6'/%3E%3C/svg%3E"
    />
  </head>
  <body data-scene="loading">
    <canvas id="stage"></canvas>

    <div id="ui">
      <div class="layer jar-layer">
        <button class="jar-button" type="button"></button>
        <p class="jar-hint" aria-hidden="true"></p>
      </div>

      <div class="layer water-layer">
        <nav class="works-nav"></nav>
        <div class="hover-caption" aria-hidden="true">
          <p class="hover-title"></p>
          <p class="hover-info"></p>
          <p class="hover-stack"></p>
        </div>
        <button class="back-button text-button" type="button"></button>
        <p class="water-hint"></p>
      </div>

      <section class="layer focus-layer">
        <div class="focus-meta">
          <h2 class="focus-title"></h2>
          <p class="focus-info"></p>
        </div>
        <div class="focus-text">
          <div class="clues" aria-live="polite"></div>
          <div class="focus-brief">
            <p class="focus-stack"></p>
            <p class="focus-summary"></p>
          </div>
          <div class="focus-foot">
            <nav class="clue-nav"></nav>
            <div class="focus-actions">
              <button class="sound-button text-button" type="button"></button>
              <a class="project-link text-button" target="_blank" rel="noopener"></a>
            </div>
          </div>
        </div>
        <button class="close-button text-button" type="button"></button>
      </section>

      <div class="fallback" hidden>
        <p class="fallback-message"></p>
        <ul class="fallback-list"></ul>
      </div>
    </div>

    <noscript><p class="noscript">请开启 JavaScript 后浏览这个网站。</p></noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
